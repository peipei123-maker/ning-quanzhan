<!DOCTYPE html>
<!--
  姓名：卜宁 | 学号：24001010202 | 时间：2026-11-23 | 大模型：DeepSeek-V4-Flash
  数据库表查看（作业截图用）
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据库表查看 · 卜宁 24001010202</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #f5f7fb; color: #1f2937; padding: 26px; }
    h1 { font-size: 22px; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #6b7280; margin-bottom: 18px; }
    .cards { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px 16px; min-width: 220px; }
    .card .nm { font-size: 13px; color: #374151; font-family: Consolas, monospace; }
    .card .num { font-size: 22px; font-weight: 700; color: #2563eb; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; background: #fff; font-size: 12.5px; margin-bottom: 20px; }
    th, td { border: 1px solid #e5e7eb; padding: 7px 9px; text-align: left; vertical-align: top; }
    th { background: #f1f5f9; font-weight: 600; }
    td { word-break: break-all; }
    h2 { font-size: 15px; margin: 18px 0 8px; color: #111827; }
    .btn { padding: 6px 12px; font-size: 12.5px; border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; cursor: pointer; margin-right: 6px; }
    .btn.on { background: #2563eb; color: #fff; border-color: #2563eb; }
    .trunc { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <h1>数据库表查看</h1>
  <p class="sub">库：<b id="dbname">buning_202_technews</b>　|　作者：卜宁 24001010202　|　接口：/api/buning_202_db/tables</p>

  <div class="cards" id="cards"></div>

  <div>
    <button class="btn on" data-t="buning_202_kb">buning_202_kb</button>
    <button class="btn" data-t="buning_202_kb_chunk">buning_202_kb_chunk</button>
    <button class="btn" data-t="buning_202_news">buning_202_news</button>
    <button class="btn" data-t="buning_202_gallery">buning_202_gallery</button>
  </div>

  <h2 id="tname">buning_202_kb</h2>
  <div id="tablebox"></div>

  <script>
    var current = 'buning_202_kb';
    function loadTables() {
      fetch('/api/buning_202_db/tables').then(function (r) { return r.json(); }).then(function (d) {
        if (d.code !== 0) return;
        document.getElementById('dbname').textContent = d.data.database;
        var box = document.getElementById('cards');
        box.innerHTML = '';
        d.data.tables.forEach(function (t) {
          var el = document.createElement('div');
          el.className = 'card';
          el.innerHTML = '<div class="nm">' + t.name + '</div><div class="num">' + t.rowCount + ' 行</div>';
          box.appendChild(el);
        });
      });
    }
    function loadRows(t, limit) {
      current = t;
      document.getElementById('tname').textContent = t + '（前 ' + (limit || 8) + ' 行）';
      Array.prototype.forEach.call(document.querySelectorAll('.btn'), function (b) {
        b.classList.toggle('on', b.getAttribute('data-t') === t);
      });
      fetch('/api/buning_202_db/rows/' + t + '?limit=' + (limit || 8))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var box = document.getElementById('tablebox');
          if (d.code !== 0) { box.innerHTML = '<p>读取失败：' + d.msg + '</p>'; return; }
          var rows = d.data.rows;
          if (!rows.length) { box.innerHTML = '<p>该表暂无数据</p>'; return; }
          var cols = Object.keys(rows[0]);
          var html = '<table><thead><tr>';
          cols.forEach(function (c) { html += '<th>' + c + '</th>'; });
          html += '</tr></thead><tbody>';
          rows.forEach(function (r) {
            html += '<tr>';
            cols.forEach(function (c) {
              var v = r[c];
              if (v === null || v === undefined) v = '';
              v = String(v);
              var isLong = /embedding|content/i.test(c) && v.length > 80;
              html += '<td class="' + (isLong ? 'trunc' : '') + '">' + v.replace(/</g, '&lt;') + '</td>';
            });
            html += '</tr>';
          });
          html += '</tbody></table>';
          box.innerHTML = html;
        });
    }
    Array.prototype.forEach.call(document.querySelectorAll('.btn'), function (b) {
      b.addEventListener('click', function () { loadRows(b.getAttribute('data-t')); });
    });
    loadTables();
    loadRows('buning_202_kb');
  </script>
</body>
</html>
