<!DOCTYPE html>
<!--
  姓名：卜宁 | 学号：24001010202 | 时间：2026-11-23 | 大模型：DeepSeek-V4-Flash
  知识库（RAG）页面：上传 → 解析 → 向量化 → 检索问答
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知识库问答 · 卜宁 24001010202</title>
  <link rel="stylesheet" href="./css/buning_202_chat.css" />
  <style>
    .kb_grid { display: grid; grid-template-columns: 340px 1fr; gap: 18px; }
    @media (max-width: 900px) { .kb_grid { grid-template-columns: 1fr; } }
    .kb_panel { background: rgba(15,23,42,.6); border: 1px solid rgba(125,211,252,.16); border-radius: 14px; padding: 16px; }
    .kb_panel h2 { font-size: 16px; color: #cfe3ff; margin-bottom: 10px; }
    .kb_drop {
      border: 1px dashed rgba(125,211,252,.45); border-radius: 12px; padding: 18px 12px; text-align: center;
      color: #8fa2c4; font-size: 13px; cursor: pointer; transition: .15s;
    }
    .kb_drop:hover, .kb_drop.over { background: rgba(125,211,252,.10); border-color: rgba(125,211,252,.8); }
    .kb_hint { font-size: 11.5px; color: #7d8fb0; margin-top: 8px; line-height: 1.7; }
    .kb_list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
    .kb_item {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 9px 11px; border-radius: 10px; background: rgba(23,34,58,.7); border: 1px solid rgba(125,211,252,.12);
      font-size: 12.5px; cursor: pointer;
    }
    .kb_item.active { border-color: rgba(125,211,252,.8); background: rgba(125,211,252,.12); }
    .kb_item .nm { color: #cfe3ff; }
    .kb_item .mt { color: #7d8fb0; font-size: 11.5px; }
    .kb_del { color: #fca5a5; background: none; border: 0; cursor: pointer; font-size: 12px; }
    .kb_src { font-size: 11.5px; color: #93a6c8; margin-top: 6px; border-top: 1px dashed rgba(125,211,252,.16); padding-top: 6px; }
    .kb_src b { color: #7dd3fc; font-weight: normal; }
    #kb_status { font-size: 12.5px; color: #7dd3fc; margin-top: 10px; min-height: 18px; }
  </style>
</head>
<body>
  <main class="buning_202_chat_wrap">
    <header class="buning_202_chat_head">
      <h1>知识库问答（RAG）</h1>
      <p class="buning_202_chat_sub">
        支持 txt / md / pdf / docx / doc / pptx · 向量模型 <code>BAAI/bge-m3</code> · 回答模型 <code>DeepSeek-V4-Flash</code>
      </p>
      <a class="buning_202_chat_back" href="./index.html">← 返回首页</a>
    </header>

    <div class="kb_grid">
      <section class="kb_panel">
        <h2>知识库管理</h2>
        <div class="kb_drop" id="kb_drop">
          点击选择文件，或把文件拖到这里<br />（支持 .txt .md .pdf .docx .doc .pptx）
        </div>
        <input type="file" id="kb_file" accept=".txt,.md,.csv,.pdf,.docx,.doc,.pptx" style="display:none" />
        <p class="kb_hint">上传后会自动解析 → 分块 → 向量化并入库，稍等几秒。</p>
        <div id="kb_status"></div>
        <div class="kb_list" id="kb_list"></div>
      </section>

      <section class="kb_panel">
        <h2>基于知识库提问</h2>
        <section class="buning_202_chat_body" id="buning_202_chat_body" style="height:44vh">
          <div class="buning_202_msg buning_202_msg_ai">
            <div class="buning_202_bubble">先在左侧上传知识库文件，然后在这里提问，我会只根据知识库内容回答并标出出处。</div>
          </div>
        </section>
        <form class="buning_202_chat_form" id="buning_202_chat_form">
          <textarea id="buning_202_chat_input" rows="2" placeholder="例如：这款平台支持哪些文件格式？"></textarea>
          <button type="submit" id="buning_202_chat_send">提问</button>
        </form>
        <p class="buning_202_chat_tip" id="buning_202_chat_tip">未选知识库时默认检索全部；按 F12 可看收发数据</p>
      </section>
    </div>
  </main>
  <script>window.__BN_API__ = '/api/buning_202_kb/ask';</script>
  <script src="./js/buning_202_chat.js"></script>
  <script src="./js/buning_202_kb.js"></script>
</body>
</html>
